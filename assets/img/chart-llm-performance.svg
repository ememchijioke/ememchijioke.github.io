<svg width="760" height="320" viewBox="0 0 760 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="320" rx="16" fill="#0F1829"/>
  <text x="380" y="32" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">Quality vs Latency (Illustrative)</text>
  <line x1="80" y1="260" x2="700" y2="260" stroke="#1E2C45" stroke-width="2"/>

  <rect x="120" y="150" width="60" height="110" rx="6" fill="#2B9DD7"/>
  <text x="150" y="280" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Dense</text>

  <rect x="250" y="120" width="60" height="140" rx="6" fill="#9BC5FF"/>
  <text x="280" y="280" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">MoE</text>

  <rect x="380" y="200" width="60" height="60" rx="6" fill="#2B9DD7"/>
  <text x="410" y="280" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Small</text>

  <rect x="510" y="180" width="60" height="80" rx="6" fill="#9BC5FF"/>
  <text x="540" y="280" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Edge</text>

  <path d="M130 130 C200 80 300 90 360 140" stroke="#F9FAFC" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="130" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="11">Higher quality</text>

  <path d="M400 240 C480 220 560 210 620 200" stroke="#F9FAFC" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="610" y="215" fill="#F9FAFC" font-family="Helvetica, Arial, sans-serif" font-size="11">Lower latency</text>
</svg>
