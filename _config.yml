title: "Chijioke Emem"
description: "Portfolio and writing on data science, engineering, and teaching."
url: "https://ememchijioke.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

author:
  name: "Chijioke Emem"
  email: "hello@ememchijioke.com"
  role: "Data Scientist & Educator"
  location: "Remote"

github_username: "ememchijioke"
linkedin_slug: "ememchijioke"
twitter_username: "ememchijioke"

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

sass:
  style: compressed
