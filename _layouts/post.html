---
layout: default
---
<article class="post">
  <p class="post-meta">
    <span>{{ page.date | date: "%B %-d, %Y" }}</span>
    {%- if page.tags %}
    &nbsp;•&nbsp;
    <span class="tags">{{ page.tags | join: ", " }}</span>
    {%- endif %}
  </p>
  <h1 class="post-title">{{ page.title }}</h1>
  {%- if page.subtitle %}
  <p class="post-subtitle">{{ page.subtitle }}</p>
  {%- endif %}
  <div class="post-body">
    {{ content }}
  </div>
</article>
